[tool.poetry]
name = "whisper-v3-server"
version = "0.1.0"
description = ""
authors = ["Zhima-Mochi <yehgoter@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
fastapi = "^0.162.0"
uvicorn = "^0.34.2"
pydub = "^0.25.1"
pyannote-audio = "^4.0.7"
torch = ">=2.13.0,<3.0"
python-dotenv = "^1.2.2"
faster-whisper = "^1.2.1"
hf-xet = "^1.1.0"
python-multipart = ">=0.0.22,<0.1"

# Minimum versions covering the repository's Dependabot advisories.
lightning = ">=2.6.6,<3.0"
pytorch-lightning = ">=2.6.6,<3.0"
pillow = ">=13.0.0,<14.0"
aiohttp = ">=3.14.4,<4.0"
starlette = ">=1.3.1,<2.0"
anyio = ">=4.14.2,<5.0"
requests = ">=2.33.0,<3.0"
urllib3 = ">=2.8.0,<3.0"
protobuf = ">=6.33.5,<7.0"
filelock = ">=4.2.1,<5.0"
fonttools = ">=4.60.2,<5.0"
pygments = ">=2.20.0,<3.0"
idna = ">=3.15,<4.0"
certifi = ">=2026.10.19"
setuptools = ">=83.0.0"
mako = ">=1.3.12,<2.0"
fsspec = { version = ">=2026.6.0,<2028.0", extras = ["http"] }

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
test = [
    "httpx2 (>=2.16.0,<3.0.0)"
]
